<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img"
     aria-label="Tipos de capas para representar datos geoespaciales: puntos, líneas, arcos, hexágonos, polígonos y mapas de calor, cada capa con color, tamaño y etiqueta configurables">
  <defs>
    <style>
      .tc-cap { font: 700 13px Montserrat, system-ui, sans-serif; fill: #002b49; }
      .tc-t   { font: 700 11px Montserrat, system-ui, sans-serif; fill: #16212e; }
      .tc-s   { font: 400 9px Montserrat, system-ui, sans-serif; fill: #44546a; }
    </style>
  </defs>
  <rect x="0" y="0" width="640" height="250" rx="14" fill="#f2f0eb"/>
  <text x="24" y="34" class="tc-cap">Tipos de capa de visualización</text>

  <!-- Puntos -->
  <g transform="translate(24,52)">
    <rect width="186" height="86" rx="10" fill="#ffffff" stroke="#d9e0e8"/>
    <text x="12" y="22" class="tc-t">Puntos</text>
    <circle cx="40" cy="52" r="7" fill="#0a7b86"/>
    <circle cx="70" cy="62" r="7" fill="#0a7b86"/>
    <circle cx="100" cy="46" r="7" fill="#0a7b86"/>
    <circle cx="130" cy="58" r="7" fill="#0a7b86"/>
    <text x="12" y="80" class="tc-s">lat + lon por registro</text>
  </g>
  <!-- Líneas / arcos -->
  <g transform="translate(226,52)">
    <rect width="186" height="86" rx="10" fill="#ffffff" stroke="#d9e0e8"/>
    <text x="12" y="22" class="tc-t">Líneas y arcos</text>
    <path d="M14 66 Q 60 30 100 56 T 170 50" fill="none" stroke="#1b63b0" stroke-width="2.5"/>
    <text x="12" y="80" class="tc-s">conexiones origen-destino</text>
  </g>
  <!-- Hexágonos -->
  <g transform="translate(428,52)">
    <rect width="186" height="86" rx="10" fill="#ffffff" stroke="#d9e0e8"/>
    <text x="12" y="22" class="tc-t">Hexágonos</text>
    <polygon points="40,40 52,47 52,61 40,68 28,61 28,47" fill="#6b4bb0" opacity="0.5"/>
    <polygon points="70,40 82,47 82,61 70,68 58,61 58,47" fill="#6b4bb0" opacity="0.8"/>
    <polygon points="100,40 112,47 112,61 100,68 88,61 88,47" fill="#6b4bb0"/>
    <text x="12" y="80" class="tc-s">agrupa por celdas</text>
  </g>
  <!-- Polígonos -->
  <g transform="translate(24,146)">
    <rect width="186" height="86" rx="10" fill="#ffffff" stroke="#d9e0e8"/>
    <text x="12" y="22" class="tc-t">Polígonos</text>
    <polygon points="24,44 70,38 90,64 50,74 20,62" fill="#1b8f4d" opacity="0.5" stroke="#1b8f4d"/>
    <text x="12" y="80" class="tc-s">zonas y límites</text>
  </g>
  <!-- Mapa de calor -->
  <g transform="translate(226,146)">
    <rect width="186" height="86" rx="10" fill="#ffffff" stroke="#d9e0e8"/>
    <text x="12" y="22" class="tc-t">Mapa de calor</text>
    <radialGradient id="tc-heat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8830c"/>
      <stop offset="60%" stop-color="#e8830c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e8830c" stop-opacity="0"/>
    </radialGradient>
    <circle cx="70" cy="56" r="28" fill="url(#tc-heat)"/>
    <circle cx="120" cy="60" r="20" fill="url(#tc-heat)"/>
    <text x="12" y="80" class="tc-s">concentraciones</text>
  </g>
  <!-- Columnas / barras 3D -->
  <g transform="translate(428,146)">
    <rect width="186" height="86" rx="10" fill="#ffffff" stroke="#d9e0e8"/>
    <text x="12" y="22" class="tc-t">Columnas</text>
    <rect x="30" y="52" width="10" height="20" fill="#002b49"/>
    <rect x="52" y="44" width="10" height="28" fill="#0a7b86"/>
    <rect x="74" y="36" width="10" height="36" fill="#00a0b0"/>
    <rect x="96" y="48" width="10" height="24" fill="#0a7b86"/>
    <text x="12" y="80" class="tc-s">magnitud sobre el mapa</text>
  </g>
</svg>
