version: 1
frontend:
  phases:
    preBuild:
      commands:
        # La imagen de build de Amplify no trae pnpm preinstalado.
        # Lo habilitamos con Corepack (incluido en Node) a la version exacta
        # fijada en package.json (packageManager: pnpm@12.14.0), para respetar
        # la politica de "solo pnpm" del proyecto (preinstall rechaza npm/yarn).
        - corepack enable
        - corepack prepare pnpm@12.14.0 --activate
        - pnpm --version
        # Instalacion reproducible a partir de pnpm-lock.yaml.
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run build
  artifacts:
    # Salida de produccion de Vite.
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*
